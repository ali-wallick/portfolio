version: 2
updates:
  # npm dependencies (Astro, fontsource packages, playwright, etc.)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - '*'
    open-pull-requests-limit: 5
    ignore:
      # @astrojs/check@0.9.10's peer dep is typescript ^5.0.0 || ^6.0.0, so a
      # major bump breaks npm ci. Recurred twice (#116, #122) before this was
      # added. Remove once @astrojs/check supports typescript@^7 — see #117.
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
