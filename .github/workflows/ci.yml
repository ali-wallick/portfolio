name: CI

on:
  push:
    branches: [master]
  pull_request:

# A second push to the same branch cancels the first — this repo gets a lot of
# small preview-driven pushes and there is no value in finishing a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types & Astro diagnostics
        run: npm run check

      # Production settings: drafts excluded, exactly as aliwallick.com will be
      # built. Cloudflare's preview builds set SHOW_DRAFTS=true; CI deliberately
      # does not, so the production build is what gets gated.
      - name: Build
        run: npm run build

      - name: Link & markup checks
        run: npm run links

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Lighthouse runs against a drafts-visible build so that project pages
      # have something on them to measure. Once Phase 3 lands real content and
      # entries stop being drafts, this can drop the env var.
      - name: Build (with drafts, so pages are non-empty)
        run: npm run build
        env:
          SHOW_DRAFTS: 'true'

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 7
