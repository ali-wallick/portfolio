name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A second push to the same branch cancels the first — this repo gets a lot of
# small preview-driven pushes and there is no value in finishing a stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` runs `playwright install --only-shell chromium` via postinstall,
      # because the resume PDFs are generated from the built pages by
      # scripts/build-pdf.mjs. That is ~95 MB, so cache it on the Playwright
      # version rather than re-downloading it on every push.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types & Astro diagnostics
        run: npm run check

      # Production settings: drafts excluded, exactly as aliwallick.com will be
      # built. Cloudflare's non-production branches build WITH drafts via
      # scripts/build-ci.mjs; CI deliberately does not, so what gets gated here
      # is the thing that actually ships.
      - name: Build
        run: npm run build

      # Hash-based, NOT a byte comparison of the PDFs themselves. The build step
      # above does regenerate them here, but `--font-body` is `system-ui`, so a
      # Linux runner renders a different (and much smaller) file than the macOS
      # machine that produced the committed one — 33 KB against 167 KB. Byte
      # equality across platforms is not a property these files have, and
      # asserting it just fails every run.
      #
      # What the build step is genuinely worth doing here: it's the only place
      # PDF *generation* runs at all, since Cloudflare can't launch a browser.
      # It exercises build-pdf.mjs end to end and re-checks both page counts
      # against a second font stack, which is a stricter layout test than macOS
      # alone.
      - name: Resume PDFs are current
        run: npm run check:pdf

      # docs/LINKEDIN.md is generated from the jobs/education collections, so a
      # bullet edit that isn't regenerated leaves Ali pasting stale copy into
      # the one surface no agent can check afterwards.
      #
      # `check:resume-print` is deliberately NOT here, and that is item 1 of
      # #191 rather than an oversight: scripts/resume-print-baseline.json was
      # recorded on macOS, and resume.css pins the print block's `--font-body`
      # to `system-ui`, so ubuntu-latest renders a different face with
      # different metrics and the differ would fail for font reasons unrelated
      # to the change under review. It needs a call on naming an embeddable
      # face for paper first. This guard has no font dependency.
      - name: LinkedIn doc is current
        run: npm run check:linkedin

      - name: Link & markup checks
        run: npm run links

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    # Skip on draft PRs to avoid burning Actions minutes on a build most of
    # which is thrown away the moment another commit lands. `push` events have
    # no `pull_request` payload at all, so the draft check only applies to the
    # `pull_request` trigger; `main` pushes always run it. Pairs with the
    # `ready_for_review` type added to the workflow's `pull_request` trigger
    # above, so marking a PR ready runs Lighthouse even with no new commit.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Lighthouse gates the PRODUCTION build — what actually ships. It reuses
      # the `build` job's own `dist/`, uploaded above, rather than rebuilding:
      # same commit, same production settings, so a second `astro build` would
      # only reproduce the first one at the cost of a full `npm ci`. That `npm
      # ci` would also be pure waste here — it exists in the `build` job to
      # trigger the `postinstall` Playwright Chromium download for
      # `build:pdf`, which this job never runs. Neither `npx @lhci/cli`
      # (self-installing) nor scripts/lighthouse-summary.mjs (no dependencies
      # beyond node:fs/node:path) needs node_modules at all.
      #
      # The first run pointed it at a drafts-visible build so project pages
      # would be non-empty, and it failed for two reasons that were both
      # artifacts of measuring unpublished work:
      #   - SEO 0.54, because draft pages emit `robots: noindex`, which
      #     Lighthouse's SEO category correctly and heavily penalizes.
      #   - Best practices 0.93 on the one page carrying a YouTube iframe.
      # Neither said anything about the site Ali publishes.
      #
      # Project detail pages are measured now (#103) — /projects/marvel-snap
      # for the video hero and /projects/prodigal as an image-hero control,
      # plus /resume/full and /404, which were unmeasured too. Measured against
      # a production build, the iframe's cost is exactly the 0.93 predicted
      # above, and it is one audit: `inspector-issues`, reporting a cookie set
      # by youtube-nocookie.com. Third-party, inside an iframe, not ours to
      # fix.
      #
      # Resolved by lowering best-practices to 0.90 for project detail pages
      # only, via lighthouserc.json's assertMatrix — NOT by carving out the
      # audit, which would not have worked: `categories:best-practices` asserts
      # the score Lighthouse computes, so switching an audit assertion off
      # leaves the category score where it was. Every other page and every
      # other category still holds the original bar.
      #
      # Worth knowing about the 0.05 that is left: `errors-in-console` fails on
      # EVERY page, gated ones included, and always has. The Cloudflare
      # Insights beacon POSTs to cloudflareinsights.com, whose CORS preflight
      # can't match lhci's random localhost port, so every page scores 0.96
      # against a 0.95 bar — one hundredth of headroom, spent on an artifact of
      # serving `dist/` locally rather than on anything about the site. See
      # #221; don't read a future 0.96 as comfortable.
      - name: Download build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.x autorun

      # Scores in the job log, so a red build explains itself without anyone
      # downloading an artifact. The artifact upload silently produced nothing
      # from the hidden .lighthouseci directory, which is the wrong thing to
      # discover at the moment you actually need the numbers.
      - name: Lighthouse scores
        if: always()
        run: node scripts/lighthouse-summary.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: lighthouse-report/
          if-no-files-found: warn
          retention-days: 7
