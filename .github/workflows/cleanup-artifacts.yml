name: Delete all Actions artifacts (one-off)

# Manual, one-off cleanup to reclaim Actions storage immediately rather than
# waiting out the existing 7-day-retention backlog. Not meant to stay in the
# repo — delete this file once it's been run.
on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete every artifact in the repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          total=0
          while :; do
            ids=$(gh api "repos/$repo/actions/artifacts?per_page=100" --jq '.artifacts[].id')
            if [ -z "$ids" ]; then break; fi
            for id in $ids; do
              echo "Deleting artifact $id"
              gh api -X DELETE "repos/$repo/actions/artifacts/$id"
              total=$((total + 1))
            done
          done
          echo "Deleted $total artifacts"
